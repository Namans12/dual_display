plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// Shared release key (docs/signing.md). Its passwords live OUTSIDE the repo in
// ~/.dualslate/signing.properties (or the file named by DUALSLATE_SIGNING), so every
// machine that has that folder builds APKs Android accepts as updates of each other.
// Without it the build falls back to this machine's debug key, as before.
def signingFile = file(System.getenv("DUALSLATE_SIGNING") ?:
        "${System.getProperty('user.home')}/.dualslate/signing.properties")
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def haveReleaseKey = signingFile.exists() && signingProps['storeFile']

android {
    namespace = "com.heysnap.extdisplay"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.heysnap.extdisplay"
        minSdk = 29
        targetSdk = 35
        versionCode = 10
        versionName = "0.11.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (haveReleaseKey) {
                // A relative storeFile is relative to the properties file's folder.
                def store = new File(signingProps['storeFile'] as String)
                storeFile store.isAbsolute() ? store : new File(signingFile.parentFile, store.path)
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword'] ?: signingProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // The shared release key when this machine has it, else the debug key.
            signingConfig haveReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}
